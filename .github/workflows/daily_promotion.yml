name: ChalakSetu Daily Promotion Agent

on:
  schedule:
    # Every day at 3:00 AM UTC = 8:30 AM India time
    - cron: "0 3 * * *"

  # Allows manual testing from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-promotion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Gemini AI package
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Run ChalakSetu AI Promotion Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python promotion_agent.py

      - name: Commit AI promotion package
        run: |
          git config --global user.name "ChalakSetu Promotion Agent"
          git config --global user.email "promotion-agent@users.noreply.github.com"
          git add promotions/
          git diff --cached --quiet || git commit -m "Create AI daily promotion package"
          git push
