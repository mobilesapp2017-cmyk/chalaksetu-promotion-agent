name: ChalakSetu Daily Promotion Agent

on:
  schedule:
    # Every day at 3:00 AM UTC = 8:30 AM India time
    - cron: "0 3 * * *"

  # Allows manual testing from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-promotion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install google-genai

      - name: Run ChalakSetu AI Promotion Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python promotion_agent.py

      - name: Commit AI promotion package
        run: |
          git config --global user.name "ChalakSetu Promotion Agent"
          git config --global user.email "actions@github.com"

          git add promotions/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Create AI daily promotion package"
            git push
          fi

      - name: Send promotion to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PROMOTION_FILE="promotions/$(date +'%Y-%m-%d')/promotion.md"

          if [ -f "$PROMOTION_FILE" ]; then
            MESSAGE=$(cat "$PROMOTION_FILE")

            curl -s -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MESSAGE}"
          else
            echo "Promotion file not found: $PROMOTION_FILE"
            exit 1
          fi
