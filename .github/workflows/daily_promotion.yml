name: ChalakSetu Hourly Promotion Agent

on:
  schedule:
    # Run once every hour
    - cron: "0 * * * *"

  # Allows manual testing from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-promotion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install google-genai requests

      - name: Run ChalakSetu AI Promotion Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python promotion_agent.py

      - name: Commit AI promotion package
        run: |
          git config --global user.name "ChalakSetu Promotion Agent"
          git config --global user.email "actions@github.com"

          git add promotions/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Create AI hourly promotion package"
            git push
          fi

      - name: Send complete promotion to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TODAY=$(date -u +'%Y-%m-%d')
          HOUR=$(date -u +'%H')
          export TODAY
          export HOUR

          python - <<'PY'
          import os
          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          today = os.environ["TODAY"]
          hour = os.environ["HOUR"]

          file_path = f"promotions/{today}/{hour}00/promotion.md"

          print(f"Reading promotion file: {file_path}")

          with open(file_path, "r", encoding="utf-8") as f:
              text = f.read()

          # Improve the main heading for Telegram
          text = text.replace(
              "# CHALAKSETU HOURLY PROMOTION",
              "CHALAKSETU HOURLY PROMOTION"
          )

          # Telegram maximum message size is 4096 characters.
          # Keep some space for the part heading.
          max_length = 3800
          chunks = []

          while len(text) > max_length:
              split_at = text.rfind("\n", 0, max_length)

              if split_at == -1:
                  split_at = max_length

              chunks.append(text[:split_at])
              text = text[split_at:].lstrip()

          if text:
              chunks.append(text)

          print(f"Sending {len(chunks)} Telegram message(s)")

          for i, chunk in enumerate(chunks, start=1):

              header = (
                  "CHALAKSETU HOURLY PROMOTION\n"
                  f"Part {i}/{len(chunks)}\n\n"
              )

              response = requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  json={
                      "chat_id": chat_id,
                      "text": header + chunk
                  },
                  timeout=30
              )

              print(response.text)
              response.raise_for_status()

          print("Hourly promotion sent successfully to Telegram!")
          PY
