name: ChalakSetu Daily Promotion Agent

on:
  schedule:
    # Runs every day at 3:00 AM UTC = 8:30 AM India time
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-promotion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ChalakSetu Promotion Agent
        run: python promotion_agent.py

      - name: Commit daily promotion package
        run: |
          git config --global user.name "ChalakSetu Promotion Agent"
          git config --global user.email "promotion-agent@users.noreply.github.com"
          git add promotions/
          git diff --cached --quiet || git commit -m "Create daily promotion package"
          git push
