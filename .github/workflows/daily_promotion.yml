name: ChalakSetu Daily Promotion Agent

on:
  schedule:
    # Every day at 3:00 AM UTC = 8:30 AM India time
    - cron: "0 3 * * *"

  # Allows manual testing from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-promotion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install google-genai requests

      - name: Run ChalakSetu AI Promotion Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python promotion_agent.py

      - name: Commit AI promotion package
        run: |
          git config --global user.name "ChalakSetu Promotion Agent"
          git config --global user.email "actions@github.com"

          git add promotions/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Create AI daily promotion package"
            git push
          fi
            - name: Send complete promotion to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TODAY=$(date +'%Y-%m-%d')
          export TODAY

          python - <<'PY'
          import os
          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          today = os.environ["TODAY"]

          file_path = f"promotions/{today}/promotion.md"

          print(f"Reading promotion file: {file_path}")

          with open(file_path, "r", encoding="utf-8") as f:
              text = f.read()

          # Make Telegram message more readable
          text = text.replace(
              "# ChalakSetu AI Daily Promotion Package",
              "🚛 CHALAKSETU DAILY PROMOTION"
          )

          # Telegram maximum message size is 4096 characters.
          # Split long promotions automatically.
          chunks = []

          while len(text) > 4000:
              split_at = text.rfind("\n", 0, 4000)

              if split_at == -1:
                  split_at = 4000

              chunks.append(text[:split_at])
              text = text[split_at:].lstrip()

          if text:
              chunks.append(text)

          print(f"Sending {len(chunks)} Telegram message(s)")

          for i, chunk in enumerate(chunks, start=1):
              if len(chunks) > 1:
                  chunk = f"🚛 CHALAKSETU PROMOTION\n📦 Part {i}/{len(chunks)}\n\n{chunk}"

              response = requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  json={
                      "chat_id": chat_id,
                      "text": chunk
                  },
                  timeout=30
              )

              print(response.text)
              response.raise_for_status()

          print("Promotion sent successfully to Telegram!")
          PY
