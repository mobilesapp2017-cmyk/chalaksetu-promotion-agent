name: ChalakSetu Daily Promotion Agent

on:
  schedule:
    # Every day at 3:00 AM UTC = 8:30 AM India time
    - cron: "0 3 * * *"

  # Allows manual testing from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-promotion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install google-genai requests

      - name: Run ChalakSetu AI Promotion Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python promotion_agent.py

      - name: Commit AI promotion package
        run: |
          git config --global user.name "ChalakSetu Promotion Agent"
          git config --global user.email "actions@github.com"

          git add promotions/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Create AI daily promotion package"
            git push
          fi
      - name: Send complete promotion to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PROMOTION_FILE="promotions/$(date +'%Y-%m-%d')/promotion.md"

          if [ ! -f "$PROMOTION_FILE" ]; then
            echo "Promotion file not found: $PROMOTION_FILE"
            exit 1
          fi

          MESSAGE=$(python - <<'PY'
          import re

          file_path = "promotions/$(date +'%Y-%m-%d')/promotion.md"

          with open(file_path, "r", encoding="utf-8") as f:
              text = f.read()

          text = re.sub(r'^# ', '🚛 ', text, flags=re.MULTILINE)
          text = re.sub(r'^## ', '━━━━━━━━━━━━\n\n📌 ', text, flags=re.MULTILINE)
          text = text.replace("**Date:**", "📅 Date:")
          text = text.replace("**Today's Vehicle Category:**", "🚗 Vehicle Category:")
          text = text.replace("**Vehicles / Equipment:**", "🚜 Vehicles / Equipment:")
          text = text.replace("**Target Audience:**", "🎯 Target Audience:")

          print(text)
          PY
          )

          # Telegram has a 4096-character limit per message.
          # Split the promotion into multiple messages if necessary.
          python - <<'PY'
          import os
          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          file_path = "promotions/" + os.popen("date +%Y-%m-%d").read().strip() + "/promotion.md"

          with open(file_path, "r", encoding="utf-8") as f:
              text = f.read()

          text = text.replace("# ChalakSetu AI Daily Promotion Package",
                              "🚛 CHALAKSETU DAILY PROMOTION")
          text = text.replace("## Topic", "🔥 TOPIC")
          text = text.replace("## Marketing Angle", "💡 MARKETING ANGLE")
          text = text.replace("## Hook", "🪝 HOOK")
          text = text.replace("## Hindi Script", "🎬 HINDI SCRIPT")
          text = text.replace("## Odia Script", "🎬 ODIA SCRIPT")
          text = text.replace("## Gemini Video Prompt", "🎥 GEMINI VIDEO PROMPT")
          text = text.replace("## Instagram Caption", "📱 INSTAGRAM CAPTION")
          text = text.replace("## Hashtags", "🏷️ HASHTAGS")

          chunks = []

          while len(text) > 4000:
              split_at = text.rfind("\n", 0, 4000)

              if split_at == -1:
                  split_at = 4000

              chunks.append(text[:split_at])
              text = text[split_at:].lstrip()

          if text:
              chunks.append(text)

          for i, chunk in enumerate(chunks, start=1):
              if len(chunks) > 1:
                  chunk = f"📦 PART {i}/{len(chunks)}\n\n" + chunk

              response = requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data={
                      "chat_id": chat_id,
                      "text": chunk
                  },
                  timeout=30
              )

              print(response.text)
              response.raise_for_status()
          PY
