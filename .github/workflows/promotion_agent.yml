name: ChalakSetu Telegram Promotion Agent

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  telegram-promotion-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: Run Telegram Promotion Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python promotion_agent.py

      - name: Commit new files and Telegram state
        run: |
          git config --global user.name "ChalakSetu Promotion Agent"
          git config --global user.email "actions@github.com"

          git add promotions/ telegram_state.json

          if git diff --cached --quiet; then
            echo "No new changes"
          else
            git commit -m "Update ChalakSetu promotion agent"
            git push origin main
            echo "Changes committed successfully"
          fi
